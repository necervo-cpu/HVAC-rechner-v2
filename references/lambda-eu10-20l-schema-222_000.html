<!DOCTYPE html>

<head>

  <title>Lambda EU10–20L · Prinzipschema 222_000 (CAD-Grid Hairline)</title>
  <script>
    (function () {
      var root = document.documentElement, saved = null;
      try { saved = localStorage.getItem("ag-theme"); } catch (e) {}
      var urlParams = new URLSearchParams(window.location.search);
      var queryTheme = urlParams.get("theme");
      var light = window.matchMedia("(prefers-color-scheme: light)").matches;
      root.setAttribute("data-theme", queryTheme === "light" || queryTheme === "dark" ? queryTheme : (saved === "light" || saved === "dark" ? saved : (light ? "light" : "dark")));
    })();
  </script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="agFonts" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap" rel="stylesheet"></noscript>
  <style>
    :root {
      --system-red: #ff453a;
      --system-blue: #0a84ff;
      --system-cyan: #64d2ff;
      --system-green: #30d158;
      --system-orange: #ff9f0a;
      --text-primary: #ffffff;
      --text-secondary: rgba(235, 235, 245, 0.65);
      --border-separator: rgba(84, 84, 88, 0.65);
      --surface-inner-bg: rgba(118, 118, 128, 0.24);
      --bg-canvas: #000000;
      --accent: #a8c7fa;
      --on-accent: #062e6f;
      --tonal: rgba(168, 199, 250, 0.2);
      --on-tonal: #a8c7fa;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius-card: 26px;
      --radius-control: 14px;
      --radius-pill: 9999px;
    }
    [data-theme="light"] {
      --text-primary: #000000;
      --text-secondary: rgba(60, 60, 67, 0.7);
      --border-separator: rgba(60, 60, 67, 0.25);
      --surface-inner-bg: rgba(118, 118, 128, 0.12);
      --bg-canvas: #f2f2f7;
      --accent: #0b57d0;
      --on-accent: #ffffff;
      --tonal: rgba(11, 87, 208, 0.12);
      --on-tonal: #0b57d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 1.25rem 3rem;
    }
    .app-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-separator);
      background: var(--surface-inner-bg);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .scheme-select {
      background: var(--surface-inner-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-separator);
      border-radius: var(--radius-control);
      padding: 0.5rem 0.75rem;
      font-size: 13px;
      font-weight: 500;
    }
    .flow-card {
      border: 1px solid var(--border-separator);
      border-radius: var(--radius-card);
      background: var(--surface-inner-bg);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .flow-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .flow-card-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 0.25rem 0;
    }
    .flow-card-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }
    .segmented-control {
      display: inline-flex;
      background: var(--bg-canvas);
      border: 1px solid var(--border-separator);
      border-radius: var(--radius-pill);
      padding: 2px;
      gap: 2px;
    }
    .segmented-option {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--radius-pill);
      cursor: pointer;
    }
    .segmented-option[aria-pressed="true"] {
      background: var(--tonal);
      color: var(--on-tonal);
      font-weight: 600;
    }
    .flow-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid var(--border-separator);
      border-radius: var(--radius-control);
      background: var(--bg-canvas);
      padding: 0.5rem;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      overscroll-behavior-x: contain;
    }
    .flow-svg {
      min-width: 960px;
      width: 100%;
      height: auto;
      display: block;
    }
    [data-style="hairline"] .flow-svg {
      filter: grayscale(100%) contrast(1.1);
    }
    .flow-pan-hint {
      display: none;
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }
    @media (max-width: 768px) {
      .flow-pan-hint { display: block; }
    }
  </style>
</head>

    <main>

  <script>
    (function () {
      var card = document.getElementById("flowCard");
      var styleSeg = document.getElementById("styleSegment");
      if (styleSeg && card) {
        styleSeg.addEventListener("click", function (e) {
          var btn = e.target.closest("button[data-style]");
          if (!btn) return;
          styleSeg.querySelectorAll("button").forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          card.setAttribute("data-style", btn.getAttribute("data-style"));
        });
      }
      var themeBtn = document.getElementById("themeToggleBtn");
      var themeIcon = document.getElementById("themeToggleIcon");
      if (themeBtn && themeIcon) {
        var cur = document.documentElement.getAttribute("data-theme") || "dark";
        themeIcon.textContent = cur === "dark" ? "light_mode" : "dark_mode";
        themeBtn.addEventListener("click", function () {
          var c = document.documentElement.getAttribute("data-theme") || "dark";
          var next = c === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          try { localStorage.setItem("ag-theme", next); } catch (e) {}
          themeIcon.textContent = next === "dark" ? "light_mode" : "dark_mode";
        });
      }
      var select = document.getElementById("schemaQuickSelect");
      if (select) {
        select.addEventListener("change", function () {
          window.location.href = "lambda-eu10-20l-schema-" + select.value + ".html";
        });
      }
    })();
  </script>
