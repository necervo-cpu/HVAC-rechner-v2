    <script>
      (function () {
        var root = document.documentElement, saved = null;
        try { saved = localStorage.getItem('ag-theme'); } catch (e) {}
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        root.setAttribute('data-theme', saved === 'light' || saved === 'dark' ? saved : (light ? 'light' : 'dark'));
      })();
    </script>

    <script>
      (function () {
        var root = document.documentElement, link = document.getElementById('agFonts');
        if (!link || !document.fonts || !document.fonts.load) return;
        var done = function () { root.classList.remove('icons-pending'); };
        root.classList.add('icons-pending');
        setTimeout(done, 4000);
        link.addEventListener('load', function () {
          setTimeout(function () {
            document.fonts.load('24px "Material Symbols Rounded"').then(done, done);
          }, 0);
        });
        link.addEventListener('error', done);
      })();
    </script>
